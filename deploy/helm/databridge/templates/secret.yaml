{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-env" (include "db.name" .)) }}
{{- $hmsPw := .Values.metastore.password }}
{{- if and (not $hmsPw) $old }}{{ $hmsPw = index $old.data "HMS_PASSWORD" | b64dec }}{{ end }}
{{- if not $hmsPw }}{{ $hmsPw = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db.name" . }}-env
  labels: {{- include "db.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.metastore.builtin }}
  HMS_PASSWORD: {{ $hmsPw | quote }}
  HMS_USER: hive
  HMS_JDBC_URL: {{ printf "jdbc:postgresql://%s:5432/hive_metastore" (include "db.hmsHost" .) | quote }}
  METASTORE_DSN: {{ printf "postgresql://hive:%s@%s:5432/hive_metastore" $hmsPw (include "db.hmsHost" .) | quote }}
  {{- else if .Values.metastore.external.jdbcUrl }}
  HMS_PASSWORD: {{ .Values.metastore.external.password | quote }}
  HMS_USER: {{ .Values.metastore.external.user | quote }}
  HMS_JDBC_URL: {{ .Values.metastore.external.jdbcUrl | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraSecretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
