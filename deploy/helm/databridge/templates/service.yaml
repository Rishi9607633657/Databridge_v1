apiVersion: v1
kind: Service
metadata:
  name: {{ include "db.name" . }}
  labels: {{- include "db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: databridge, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
