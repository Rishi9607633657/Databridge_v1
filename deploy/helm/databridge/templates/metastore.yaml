{{- if .Values.metastore.builtin }}
# Hive metastore on PostgreSQL: the table catalog shared by every notebook, job and executor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db.hmsHost" . }}-schema
  labels: {{- include "db.labels" . | nindent 4 }}
data:
  01-hms.sh: |
    #!/bin/sh
    set -e
    cd /hms-schema
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f hive-schema-2.3.0.postgres.sql
  hive-schema-2.3.0.postgres.sql: |-
{{ .Files.Get "files/hive-schema-2.3.0.postgres.sql" | indent 4 }}
  hive-txn-schema-2.3.0.postgres.sql: |-
{{ .Files.Get "files/hive-txn-schema-2.3.0.postgres.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "db.hmsHost" . }}
  labels: {{- include "db.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: databridge-metastore, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db.hmsHost" . }}
  labels: {{- include "db.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "db.hmsHost" . }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: databridge-metastore, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: databridge-metastore, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: hive_metastore}
            - {name: POSTGRES_USER, value: hive}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ include "db.name" . }}-env, key: HMS_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U hive -d hive_metastore"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: pg, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /hms-schema}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d/01-hms.sh, subPath: 01-hms.sh}
      volumes:
        - name: schema
          configMap: {name: {{ include "db.hmsHost" . }}-schema, defaultMode: 0755}
  volumeClaimTemplates:
    - metadata: {name: pg}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.metastore.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.metastore.size }}}
{{- end }}
