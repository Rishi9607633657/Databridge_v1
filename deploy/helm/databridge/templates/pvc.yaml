{{- if not .Values.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "db.claim" . }}
  labels: {{- include "db.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep        # never delete your data on "helm uninstall"
spec:
  accessModes: [{{ .Values.storage.accessMode }}]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
